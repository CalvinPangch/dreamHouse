name: Deploy

# Pushes to the default branch deploy to production; every other branch gets
# its own Vercel preview URL. Nothing deploys unless the browser smoke test
# passes first. Branch pushes cover pull requests too, so `pull_request` is
# deliberately not a trigger - it would deploy the same commit twice.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/package.json') }}

      - name: Install Chromium
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Serve the site
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sfo /dev/null http://127.0.0.1:8080/index.html && exit 0
            sleep 1
          done
          echo "::error::static server never came up"
          exit 1

      - name: Load every view in a real browser
        env:
          BASE_URL: http://127.0.0.1:8080
          SHOT_DIR: ${{ runner.temp }}/shots
        run: node scripts/smoke.mjs

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  deploy:
    name: Vercel
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check credentials
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing - see the Deploying section of README.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # production only for the repository's default branch
      - name: Pick the target environment
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod"    >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag="       >> "$GITHUB_OUTPUT"
          fi

      - name: Pull project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to Vercel (${{ steps.target.outputs.env }})"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
