<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>暖阳半院 · 半独立式住宅 3D 家</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<meta name="description" content="暖阳半院 —— 一套双层半独立式住宅的 3D 室内设计：一层、二层全屋漫游，房间手记与户型图，随时间变化的光。" />
<meta property="og:title" content="暖阳半院 · Sunny Half House" />
<meta property="og:description" content="双层半独立式住宅的 3D 室内设计 · 全屋漫游 · 房间手记 · 户型图" />
<meta property="og:image" content="./preview.png" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  :root {
    --cream: #faf5ed;
    --cream-2: #f3ece1;
    --card: #fffdf9;
    --ink: #4a4038;
    --ink-soft: #6f6458;
    --muted: #a89d8f;
    --line: #ece3d4;
    --amber: #e9bb5c;
    --amber-deep: #c99327;
    --shadow: 0 18px 40px rgba(123, 100, 70, .13);
    --shadow-sm: 0 6px 18px rgba(123, 100, 70, .10);
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #fffaf2 0%, var(--cream) 55%, #f0e7da 100%);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------------------------------------------------------- header */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px 6px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center;
    background: var(--card); box-shadow: var(--shadow-sm); font-size: 17px;
  }
  .brand h1 { font-size: 19px; margin: 0; letter-spacing: .04em; font-weight: 700; }
  .brand h1 sub {
    display: block; font-size: 10px; letter-spacing: .22em; color: var(--muted);
    font-weight: 600; margin-top: 2px; text-transform: uppercase;
  }
  .brand .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin-top: -14px; }

  .live {
    display: inline-flex; align-items: center; gap: 6px; margin-left: 4px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; color: var(--ink-soft); box-shadow: var(--shadow-sm);
  }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px rgba(233,187,92,.25); }

  .spacer { flex: 1; }
  .clock { text-align: right; line-height: 1.1; }
  .clock b { font-size: 26px; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .clock span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .12em; }
  .clock .wx { font-size: 20px; margin-right: 8px; }

  /* ------------------------------------------------------------ tabs */
  .tabs {
    align-self: center; display: inline-flex; gap: 4px; padding: 5px;
    background: var(--card); border-radius: 999px; box-shadow: var(--shadow-sm);
    border: 1px solid var(--line); margin: 2px auto 10px;
  }
  .tabs button {
    border: 0; background: transparent; border-radius: 999px; padding: 9px 20px;
    font-size: 13.5px; font-weight: 600; color: var(--ink-soft); display: flex; align-items: center; gap: 7px;
    transition: .18s;
  }
  .tabs button.is-on { background: var(--cream-2); color: var(--ink); }

  /* ----------------------------------------------------------- chips */
  .chipbar { display: flex; align-items: center; gap: 10px; padding: 0 22px 10px; }
  .floorswitch {
    display: inline-flex; padding: 4px; gap: 3px; background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-sm); flex: none;
  }
  .floorswitch button {
    border: 0; background: transparent; border-radius: 999px; padding: 7px 14px;
    font-size: 12.5px; font-weight: 600; color: var(--muted);
  }
  .floorswitch button.is-on { background: var(--amber); color: #fff; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 3px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 14px;
    padding: 9px 15px; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 7px; transition: .16s;
  }
  .chips button:hover { transform: translateY(-1px); }
  .chips button.is-on { background: var(--cream-2); border-color: #e0d3bd; color: var(--ink); }

  /* ----------------------------------------------------------- stage */
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hero { position: absolute; left: 34px; top: 18px; pointer-events: none; }
  .hero .eyebrow { font-size: 11.5px; color: var(--muted); letter-spacing: .2em; display: flex; align-items: center; gap: 7px; }
  .hero .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .hero h2 { font-size: 34px; margin: 10px 0 6px; letter-spacing: .03em; font-weight: 700; }
  .hero p { margin: 0; font-size: 12.5px; color: var(--muted); letter-spacing: .06em; }

  #labels { position: absolute; inset: 0; pointer-events: none; }
  .room-label {
    position: absolute; left: 0; top: 0; pointer-events: auto;
    background: rgba(255,253,249,.94); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px 6px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
    box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 7px;
    white-space: nowrap; transition: background .16s, color .16s, opacity .2s;
  }
  .room-label i { width: 6px; height: 6px; border-radius: 50%; background: #cdbfa6; }
  .room-label.is-active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .room-label.is-active i { background: var(--amber); }

  /* ------------------------------------------------------ detail card */
  .detail {
    position: absolute; right: 24px; bottom: 22px; width: 290px;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--line); padding: 18px 18px 14px;
  }
  .detail h3 { margin: 0; font-size: 21px; letter-spacing: .04em; display: flex; align-items: baseline; gap: 8px; }
  .detail h3 small { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .1em; }
  .detail .mood { margin: 7px 0 14px; font-size: 12.5px; color: var(--muted); }
  .detail .go {
    width: 100%; border: 0; border-radius: 13px; padding: 12px 15px; font-size: 13.5px; font-weight: 700;
    background: linear-gradient(100deg, #f6d68c, var(--amber)); color: #5a4415;
    display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 18px rgba(201,147,39,.22);
  }
  .detail .go:active { transform: translateY(1px); }
  .detail .sep { height: 1px; background: var(--line); margin: 14px 0 10px; }
  .detail .lede { font-size: 11px; color: var(--muted); letter-spacing: .14em; margin-bottom: 8px; }
  .detail .row {
    display: flex; align-items: center; gap: 10px; padding: 8px 2px; font-size: 13px; color: var(--ink-soft);
  }
  .detail .row b { font-weight: 600; flex: 1; }
  .detail .row .ico { width: 17px; text-align: center; opacity: .75; }
  .switch {
    width: 38px; height: 22px; border-radius: 999px; background: #e2dacb; border: 0; padding: 0;
    position: relative; transition: .18s; flex: none;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: .18s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .switch.is-on { background: #93b07f; }
  .switch.is-on::after { transform: translateX(16px); }

  /* -------------------------------------------------------- tool dock */
  .dock {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px;
    display: flex; align-items: center; gap: 4px; padding: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  }
  .dock button {
    border: 0; background: transparent; border-radius: 999px; padding: 9px 14px; font-size: 13px;
    color: var(--ink-soft); font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .dock button:hover { background: var(--cream-2); }
  .dock button.is-on { background: var(--cream-2); color: var(--ink); }
  .dock .div { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

  .walkhint {
    position: absolute; left: 28px; bottom: 28px; font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }

  /* ---------------------------------------------------------- timebar */
  .timebar {
    margin: 10px 22px 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 14px 20px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center;
  }
  .timebar .now { display: flex; align-items: baseline; gap: 9px; }
  .timebar .now b { font-size: 25px; font-variant-numeric: tabular-nums; }
  .timebar .now span { font-size: 12px; color: var(--muted); }
  .track { display: flex; align-items: center; gap: 12px; }
  .track input[type=range] { flex: 1; accent-color: var(--amber-deep); }
  .marks { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 4px; letter-spacing: .1em; }
  .speeds { display: flex; gap: 4px; align-items: center; }
  .speeds button {
    border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 5px 10px;
    font-size: 11.5px; font-weight: 700; color: var(--muted);
  }
  .speeds button.is-on { background: var(--amber); border-color: var(--amber); color: #fff; }
  .play {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent;
    display: grid; place-items: center; font-size: 13px; color: var(--ink-soft);
  }
  .wxpick { display: flex; gap: 6px; }
  .wxpick button {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent;
    font-size: 15px; display: grid; place-items: center;
  }
  .wxpick button.is-on { background: var(--cream-2); border-color: #e0d3bd; }
  .cast { display: flex; gap: 18px; align-items: center; }
  .who { display: flex; align-items: center; gap: 9px; }
  .who .face {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px;
    background: var(--cream-2); border: 1px solid var(--line);
  }
  .who b { display: block; font-size: 12.5px; }
  .who span { display: block; font-size: 11px; color: var(--muted); }
  .timebar .right { display: flex; align-items: center; gap: 16px; }

  /* ------------------------------------------------------------ notes */
  .notes {
    position: absolute; inset: 0; overflow-y: auto; padding: 6px 24px 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px;
    align-content: start; background: transparent;
  }
  .note {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow-sm);
  }
  .note .tag { width: 36px; height: 5px; border-radius: 999px; margin-bottom: 12px; }
  .note h4 { margin: 0 0 3px; font-size: 17px; letter-spacing: .03em; }
  .note h4 small { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-left: 7px; letter-spacing: .1em; }
  .note .mood { font-size: 12px; color: var(--amber-deep); margin-bottom: 10px; }
  .note p { margin: 0 0 12px; font-size: 12.8px; line-height: 1.85; color: var(--ink-soft); }
  .note ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .note li {
    font-size: 11px; background: var(--cream-2); border-radius: 8px; padding: 5px 9px; color: var(--ink-soft);
  }
  .note .light { margin-top: 10px; font-size: 11.5px; color: var(--muted); display: flex; gap: 7px; align-items: center; }

  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .detail { position: static; width: auto; margin: 10px 22px 0; }
    .hero h2 { font-size: 24px; }
    .timebar { grid-template-columns: 1fr; gap: 12px; }
    .cast { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="mark">🏠</div>
      <h1>暖阳半院<sub>Sunny Half House</sub></h1>
      <div class="dot"></div>
    </div>
    <div class="live"><i></i>实况</div>
    <div class="spacer"></div>
    <div class="clock">
      <div><span class="wx" id="wx-now">☀️</span><b id="clock">08:24</b></div>
      <span id="phase">晨光轻轻</span>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="roam" class="is-on">🏠 全屋漫游</button>
    <button data-tab="notes">🗒 房间手记</button>
    <button data-tab="plan">🗺 户型图</button>
  </nav>

  <div class="chipbar">
    <div class="floorswitch">
      <button data-floor="ground" class="is-on">一层</button>
      <button data-floor="upper">二层</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="view"></canvas>
    <div id="labels"></div>

    <div class="hero" id="hero">
      <div class="eyebrow">家的全貌</div>
      <h2>今天，也好好生活。</h2>
      <p>选一个房间，走进属于你的小小世界</p>
    </div>

    <div class="walkhint" id="walkhint">🚶 点击房间，走进去看看</div>

    <div class="dock" id="dock">
      <button id="btn-reset">↺ 复位</button>
      <div class="div"></div>
      <button id="btn-walls">▦ 完整墙体</button>
      <button id="btn-furniture" class="is-on">🛋 家具</button>
      <div class="div"></div>
      <button id="btn-top">⌂ 全屋</button>
    </div>

    <aside class="detail" id="detail"></aside>

    <div class="notes hidden" id="notes"></div>
  </div>

  <div class="timebar">
    <div class="now">
      <b id="clock2">08:24</b><span id="phase2">晨光轻轻</span>
    </div>
    <div>
      <div class="track">
        <span>☀</span>
        <input type="range" id="time" min="5" max="23" step="0.1" value="8.4" />
        <span>☾</span>
        <button class="play" id="play">▶</button>
        <div class="speeds">
          <button data-speed="1">1×</button>
          <button data-speed="6">6×</button>
          <button data-speed="24" class="is-on">24×</button>
        </div>
      </div>
      <div class="marks"><span>清晨</span><span>午后</span><span>黄昏</span><span>夜晚</span></div>
    </div>
    <div class="right">
      <div class="cast" id="cast"></div>
      <div class="wxpick" id="wxpick">
        <button data-wx="sun" class="is-on">☀️</button>
        <button data-wx="cloud">☁️</button>
        <button data-wx="rain">🌧️</button>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
